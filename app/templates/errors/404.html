{% extends "base.html" %}

{% block title %}Page Not Found - SplitSmart{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card shadow-sm border-0 p-4">
            <div class="card-body">
                <div class="display-1 text-primary fw-bold mb-3">404</div>
                <h4 class="fw-bold mb-2">Page Not Found</h4>
                <p class="text-muted mb-4">{{ message or "The page or group you're looking for does not exist or has been removed." }}</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('groups.list_groups_view') }}" class="btn btn-primary fw-semibold px-4">
                        <i class="bi bi-grid-fill me-1"></i> My Groups
                    </a>
                    <a href="/" class="btn btn-outline-secondary fw-semibold px-4">Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
