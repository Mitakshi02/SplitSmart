{% extends "base.html" %}

{% block title %}SplitSmart - Register{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-4">Create your Account</h3>
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="POST" action="{{ url_for('auth.register_view', next=request.args.get('next', '')) }}">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ data.name if data else '' }}" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ data.email if data else '' }}" placeholder="john@example.com">
                        <div class="form-text">Used to auto-link your past group expenses.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number (Optional)</label>
                        <input type="text" name="phone" class="form-control" value="{{ data.phone if data else '' }}" placeholder="+91 9876543210">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign Up & Auto-Claim</button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted">Already have an account?</span> 
                    <a href="{{ url_for('auth.login_view', next=request.args.get('next', '')) }}" class="text-decoration-none fw-semibold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
