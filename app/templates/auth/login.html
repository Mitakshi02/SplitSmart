{% extends "base.html" %}

{% block title %}SplitSmart - Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-4">Welcome to SplitSmart</h3>
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="POST" action="{{ url_for('auth.login_view', next=request.args.get('next', '')) }}">
                    <div class="mb-3">
                        <label class="form-label">Email or Phone Number</label>
                        <input type="text" name="email_or_phone" class="form-control" placeholder="user@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted">Don't have an account?</span> 
                    <a href="{{ url_for('auth.register_view', next=request.args.get('next', '')) }}" class="text-decoration-none fw-semibold">Create an account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
